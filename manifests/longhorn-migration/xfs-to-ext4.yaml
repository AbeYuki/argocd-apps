# この manifest を適用する前に、以下を環境に合わせて変更
#   namespace: default
#   source-pvc-xfs
#   destination-pvc-ext4
#   storage: 10Gi
# Job を開始する前に、source-pvc-xfs へ書き込むすべてのワークロードを停止
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: destination-pvc-ext4
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # コピー元 PVC の容量以上を指定
      storage: 1Gi
  # この StorageClass は ext4 でフォーマットされた Longhorn ボリュームを作成
  storageClassName: longhorn-ha
  volumeMode: Filesystem
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-pvc-xfs-to-ext4
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate-pvc-xfs-to-ext4
    spec:
      restartPolicy: Never
      containers:
        - name: copy
          image: debian:bookworm-slim
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -ceu
            - |
              source_type="$(stat -f -c %T /source)"
              destination_type="$(stat -f -c %T /destination)"

              echo "source filesystem: ${source_type}"
              echo "destination filesystem: ${destination_type}"

              if [ "${source_type}" != "xfs" ]; then
                echo "source is not XFS" >&2
                exit 1
              fi

              if [ "${destination_type}" != "ext2/ext3" ]; then
                echo "destination is not ext4 (stat reports ext2/ext3 for ext4)" >&2
                exit 1
              fi

              # 新しくフォーマットされた ext4 には、空の lost+found が存在する場合があります。
              if [ -d /destination/lost+found ]; then
                rmdir /destination/lost+found 2>/dev/null || true
              fi

              if [ -n "$(find /destination -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "destination PVC is not empty; refusing to overwrite it" >&2
                exit 1
              fi

              echo "copying data..."
              cp -a /source/. /destination/
              sync

              echo "comparing source and destination..."
              diff -qr /source /destination
              echo "migration completed successfully"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: destination
              mountPath: /destination
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: source-pvc-xfs
            readOnly: true
        - name: destination
          persistentVolumeClaim:
            claimName: destination-pvc-ext4
