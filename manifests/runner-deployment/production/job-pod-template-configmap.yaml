apiVersion: v1
kind: ConfigMap
metadata:
  name: terraform-sakura-cloud-dns-job-pod-template
  namespace: arc-system
data:
  job-pod-template.yaml: |
    spec:
      containers:
        - name: "$job"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 4Gi
