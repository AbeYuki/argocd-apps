vlselect:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

vlinsert:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    annotations:
      metallb.universe.tf/address-pool: vlinsert
    type: LoadBalancer

vlstorage:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistentVolume:
    accessModes:
      - ReadWriteMany
    storageClassName: "nfs-g9-enp5s0-rwx"
