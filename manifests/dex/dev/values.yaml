replicaCount: 2
revisionHistoryLimit: 3

configSecret:
  create: true

config:
  issuer: https://dex-dev.aimhighergg.com

  storage:
    type: kubernetes
    config:
      inCluster: true

  logger:
    level: info
    format: json

  oauth2:
    grantTypes:
      - authorization_code
      - refresh_token
    responseTypes:
      - code
    skipApprovalScreen: true
    alwaysShowLoginScreen: true

  enablePasswordDB: false

  connectors:
    - type: oidc
      id: entra-id
      name: Microsoft Entra ID
      config:
        issuer: "https://login.microsoftonline.com/<path:secret/data/oauth-client/entra-id/dex-dev#tenant_id>/v2.0"
        clientID: <path:secret/data/oauth-client/entra-id/dex-dev#client_id>
        clientSecret: <path:secret/data/oauth-client/entra-id/dex-dev#client_secret>
        redirectURI: https://dex-dev.aimhighergg.com/callback
        scopes:
          - profile
          - email
        # emailクレームがなければ、preferred_usernameをDexのメールアドレスとして扱う
        insecureSkipEmailVerified: true
        claimMapping:
          email: preferred_username
    - type: oidc
      id: google
      name: Google
      config:
        issuer: https://accounts.google.com
        clientID: <path:secret/data/oauth-client/google/dex#client_id>
        clientSecret: <path:secret/data/oauth-client/google/dex#client_secret>
        redirectURI: https://dex-dev.aimhighergg.com/callback

  staticClients:
    - id: <path:secret/data/oauth-client/dex/immich-dev#client_id>
      name: Immich Dev
      secret: <path:secret/data/oauth-client/dex/immich-dev#client_secret>
      redirectURIs:
        - "<path:secret/data/immich-dev#EXTERNAL_DOMAIN>/auth/login"
        - "<path:secret/data/immich-dev#EXTERNAL_DOMAIN>/user-settings"
        - "<path:secret/data/immich-dev#EXTERNAL_DOMAIN>/api/oauth/mobile-redirect"

serviceAccount:
  create: true

rbac:
  create: true
  createClusterScoped: true

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: dex
        app.kubernetes.io/name: dex

service:
  type: ClusterIP

ingress:
  enabled: false
