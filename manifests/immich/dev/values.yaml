server:
  replicaCount: 1
  resources: 
    requests:
      memory: 2048Mi
      cpu: "0.5"
    limits:
      memory: 2048Mi
      cpu: "1"
  persistence:
    storageClassName: "nfs-apps"
    accessModes:
      - ReadWriteMany
    size: 1Gi
  secret:
    annotations:
      avp.kubernetes.io/path: "secret/data/immich-dev"
    stringData:
      DB_PASSWORD: <DB_PASSWORD>
      DB_USERNAME: <DB_USERNAME>
      DB_DATABASE_NAME: <DB_DATABASE_NAME>
  immichConfig:
    immich.yaml: |
      server:
        externalDomain: "<path:secrets/data/immich-dev#EXTERNAL_DOMAIN>"
      passwordLogin:
        enabled: true
      oauth:
        enabled: true
        issuerUrl: "https://dex-dev.aimhighergg.com"
        clientId: <path:secrets/data/oauth-client/dex-dev/immich-dev#client_id>
        clientSecret: <path:secrets/data/oauth-client/dex-dev/immich-dev#client_secret>
        scope: "openid email profile"
        signingAlgorithm: "RS256"
        mobileOverrideEnabled: true
        mobileRedirectUri: "<path:secrets/data/immich-dev#EXTERNAL_DOMAIN>/api/oauth/mobile-redirect"
        autoRegister: true
      machineLearning:
        enabled: true
        urls:
          - http://immich-immich-ml:3003
postgres:
  config:
    # 新規 PVC 直下の lost+found を避け、サブディレクトリに DB を作成
    PGDATA: /var/lib/postgresql/data/pgdata
  persistence:
    storageClassName: longhorn-local
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  secret:
    annotations:
      avp.kubernetes.io/path: "secret/data/immich-dev"
    stringData:
      POSTGRES_PASSWORD: <DB_PASSWORD>
      POSTGRES_USER: <DB_USERNAME>
      POSTGRES_DB: <DB_DATABASE_NAME>
machineLearning:
  resources:
    requests:
      memory: 1024Mi
      cpu: "0.5"
    limits:
      memory: 2048Mi
      cpu: "1"
  persistence:
    storageClassName: "longhorn"
    accessModes:
      - ReadWriteOnce
    size: 1Gi
