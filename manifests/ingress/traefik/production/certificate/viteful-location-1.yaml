apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: <path:secrets/data/viteful/production/env#VITE_LOCATION_NAME_1>-<path:secrets/data/viteful/production/namespace#NAMESPACE>-tls
  namespace: <path:secrets/data/viteful/production/namespace#NAMESPACE>
spec:
  secretName: <path:secrets/data/viteful/production/env#VITE_LOCATION_NAME_1>-<path:secrets/data/viteful/production/namespace#NAMESPACE>-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod-dns01-zone-2
  dnsNames:
    - <path:secrets/data/viteful/production/ingress#HOST_1>
