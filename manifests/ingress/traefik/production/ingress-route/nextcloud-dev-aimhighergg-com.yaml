apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-dev
  namespace: nextcloud-dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nextcloud-dev.aimhighergg.com`) && PathPrefix(`/`) 
      kind: Rule
      middlewares:
        - name: ip-whitelist
          namespace: nextcloud-dev
        #- name: basic-auth
        #  namespace: nextcloud
      services:
        - name: nextcloud-nextcloud
          port: 80
  tls:
    secretName: nextcloud-dev-aimhighergg-com-tls
