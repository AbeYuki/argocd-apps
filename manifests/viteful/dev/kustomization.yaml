apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: <path:secrets/data/viteful/dev/namespace#NAMESPACE>
resources:
  - ../base/backend
  - ../base/db
  - ../base/frontend
  - avp-secret.yaml
images:
  - name: frontend
    newName: <path:secrets/data/viteful/dev/registry#FRONTEND_IMAGE>
    newTag: "0.2.0-dev"
  - name: backend
    newName: <path:secrets/data/viteful/registry#BACKEND_IMAGE>
    newTag: "0.1.1"
