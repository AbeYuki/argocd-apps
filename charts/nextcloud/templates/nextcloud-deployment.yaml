apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud.labelsWithComponent" (dict "component" "nextcloud" "context" .) | nindent 4 }}
spec:
  {{- if not .Values.nextcloud.autoscaling.enabled }}
  replicas: {{ .Values.nextcloud.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nextcloud.selectorLabelsWithComponent" (dict "component" "nextcloud" "context" .) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/nextcloud-secret.yaml") . | sha256sum }}
        {{- if .Values.sso.enabled }}
        checksum/sso-script: {{ include (print $.Template.BasePath "/sso-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.nextcloud.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nextcloud.labelsWithComponent" (dict "component" "nextcloud" "context" .) | nindent 8 }}
        {{- with .Values.nextcloud.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.nextcloud.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nextcloud.serviceAccountName" . }}
      {{- with .Values.nextcloud.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.nextcloud.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.nextcloud.image.repository }}:{{ .Values.nextcloud.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.nextcloud.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.nextcloud.service.port }}
              protocol: TCP
          {{- with .Values.nextcloud.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nextcloud.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nextcloud.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.sso.enabled }}
            - name: sso-hooks
              mountPath: /docker-entrypoint-hooks.d/before-starting/20-configure-oidc.sh
              subPath: 20-configure-oidc.sh
              readOnly: true
            {{- end }}
            - name: nextcloud
              mountPath: /var/www/html
            {{- if .Values.nextcloud.persistence.data.enabled }}
            - name: nextcloud-data
              mountPath: /var/lib/nextcloud
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "nextcloud.fullname" . }}-nextcloud
          {{- if or .Values.sso.enabled .Values.nextcloud.persistence.data.enabled }}
          env:
            {{- if .Values.nextcloud.persistence.data.enabled }}
            - name: NEXTCLOUD_DATA_DIR
              value: "/var/lib/nextcloud/data"
            {{- end }}
            {{- if .Values.sso.enabled }}
            - name: NEXTCLOUD_OIDC_ENABLED
              value: "true"
            - name: NEXTCLOUD_OIDC_PROVIDER
              value: {{ .Values.sso.provider | default "dex" | quote }}
            - name: NEXTCLOUD_OIDC_INSTALL_APP
              value: {{ .Values.sso.app.enabled | toString | quote }}
            - name: NEXTCLOUD_OIDC_SCOPES
              value: {{ .Values.sso.scopes | default "openid profile email" | quote }}
            - name: NEXTCLOUD_OIDC_USERNAME_CLAIM
              value: {{ .Values.sso.userMapping.usernameClaim | quote }}
            - name: NEXTCLOUD_OIDC_EMAIL_CLAIM
              value: {{ .Values.sso.userMapping.emailClaim | quote }}
            - name: NEXTCLOUD_OIDC_DISPLAY_NAME_CLAIM
              value: {{ .Values.sso.userMapping.displayNameClaim | quote }}
            {{- end }}
          {{- end }}
      volumes:
        {{- if .Values.sso.enabled }}
        - name: sso-hooks
          configMap:
            name: {{ include "nextcloud.fullname" . }}-sso
            defaultMode: 0555
        {{- end }}
        - name: nextcloud
          persistentVolumeClaim:
            claimName: {{ .Values.nextcloud.persistence.existingClaim | default (printf "%s-nextcloud" (include "nextcloud.fullname" .)) | quote }}
        {{- if .Values.nextcloud.persistence.data.enabled }}
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: {{ .Values.nextcloud.persistence.data.existingClaim | default (printf "%s-nextcloud-data" (include "nextcloud.fullname" .)) | quote }}
        {{- end }}
      {{- with .Values.nextcloud.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nextcloud.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nextcloud.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
