# Immich の既定値。

global:
  environment: production
  timezone: Asia/Tokyo

server:
  replicaCount: 2
  # DB・ファイルパスの移行を開始する前に旧バージョンを停止
  strategy:
    type: Recreate
  image:
    repository: ghcr.io/immich-app/immich-server
    pullPolicy: IfNotPresent
    # 空の場合は Chart.appVersion を使用
    # イメージを変更する場合は指定
    tag: ""
  service:
    type: ClusterIP
    port: 2283
    targetPort: 2283
    nodePort: ""
  resources: {}
    #requests:
    #  memory: 2048Mi
    #  cpu: "1"
    #limits:
    #  memory: 2048Mi
    #  cpu: "1"
  startupProbe:
    httpGet:
      path: /api/server/ping
      port: 2283
    # DB の移行を待つため、再起動まで最大 10 分の猶予
    failureThreshold: 120
    periodSeconds: 5
    timeoutSeconds: 2
  readinessProbe:
    httpGet:
      path: /api/server/ping
      port: 2283
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  persistence:
    # 既存環境では chart 0.1.x のマウント構成を維持
    # 新規環境では false にすると PVC 全体を /data にマウント
    # 既存環境で変更する場合は、先に README.md を確認
    legacyLayout: true
    existingClaim: ""
    storageClassName: ""
    accessModes:
      - ReadWriteMany
    size: 50Gi
  config:
    IMMICH_LOG_LEVEL: "warn"
  secret:
    annotations: {}
    stringData: {}
  immichConfigAnnotations: {}
  immichConfig: {}
    #immich.yaml: |
    #  server:
    #    externalDomain: ""
    #  passwordLogin:
    #    enabled: false
    #  oauth:
    #    enabled: true
    #    issuerUrl: "https://accounts.google.com"
    #    clientId: ""
    #    clientSecret: ""
    #    scope: "openid email profile"
    #    signingAlgorithm: "RS256"
    #    mobileOverrideEnabled: true
    #    mobileRedirectUri: ""
    #    autoRegister: false
    #  machineLearning:
    #    enabled: true
    #    urls:
    #      - http://immich-immich-ml:3003
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

machineLearning:
  replicaCount: 1
  strategy:
    type: Recreate
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 3003
    targetPort: 3003
  startupProbe:
    httpGet:
      path: /ping
      port: 3003
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 2
  readinessProbe:
    httpGet:
      path: /ping
      port: 3003
    periodSeconds: 10
    timeoutSeconds: 2
  resources:
    requests:
      memory: 2048Mi
      cpu: "2"
    limits:
      memory: 2048Mi
      cpu: "2.2"
  persistence:
    existingClaim: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  config:
    MACHINE_LEARNING_WORKERS: "1"
    MACHINE_LEARNING_REQUEST_THREADS: "1"
    MACHINE_LEARNING_MODEL_INTER_OP_THREADS: "1"
    MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: "2"
    MACHINE_LEARNING_MODEL_TTL: "300"
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  replicaCount: 1
  image:
    repository: ghcr.io/immich-app/postgres
    pullPolicy: IfNotPresent
    tag: "14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
  config:
    POSTGRES_INITDB_ARGS: "--data-checksums"
  shmSize: 128Mi
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  persistence:
    existingClaim: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  secret:
    annotations: {}
    stringData:
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "postgres"
  readinessProbe:
    exec:
      command:
        - /bin/sh
        - -ec
        - pg_isready --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  resources: {}
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

redis:
  replicaCount: 1
  image:
    repository: docker.io/valkey/valkey
    pullPolicy: IfNotPresent
    tag: "9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d"
  args:
    - --save
    - ""
    - --appendonly
    - "no"
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  readinessProbe:
    exec:
      command:
        - redis-cli
        - ping
  resources: {}
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

test:
  enabled: false
  image: busybox
